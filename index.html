<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Familiedashboard</title>
</head>
<body>

<h1>FamilyWall-test</h1>

<button onclick="testFeed()">Test FamilyWall</button>

<pre id="resultat">
Ikke testet ennå
</pre>

<script>
async function testFeed() {

    document.getElementById("resultat").innerText =
        "Tester...";

    try {

        const response = await fetch(
            "HER LIMER DU INN ICAL-LENKEN"
        );

        const text = await response.text();

        document.getElementById("resultat").innerText =
            text.substring(0, 1000);

    }
    catch(error) {

        document.getElementById("resultat").innerText =
            "Feil: " + error;

    }
}
</script>

</body>
</html>
